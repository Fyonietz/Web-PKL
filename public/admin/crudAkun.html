<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD AKUN</title>
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <body class="min-h-screen bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">CRUD AKUN</h2>
      <form class="space-y-6">
        <div>
          <label
            for="nama"
            class="block text-sm font-semibold text-gray-700 mb-2"
            >NAMA :</label
          >
          <input
            type="text"
            id="nama"
            name="nama"
            placeholder="NAMA"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-sm font-semibold text-gray-700 mb-2"
            >PASSWORD:</label
          >
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan Password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label
            for="role"
            class="block text-sm font-semibold text-gray-700 mb-2"
            >ROLE:</label
          >
          <select
            id="role"
            name="role"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Pilih Role</option>
            <option value="kabeng">Kabeng/Kaprog</option>
            <option value="waka">Waka Sarana</option>
            <option value="guru">Guru</option>
            <option value="kepala">Kepala Sekolah</option>
          </select>
        </div>
        <div>
          <label
            for="jurusan"
            class="block text-sm font-semibold text-gray-700 mb-2"
            >JURUSAN:</label
          >
          <select
            id="jurusan"
            name="jurusan"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Pilih Jurusan</option>
            <option value="rpl">Rekayasa Perangkat Lunak</option>
            <option value="tkj">Teknik Komputer Jaringan</option>
            <option value="tkr">Teknik Kendaraan Ringan</option>
            <option value="tbsm">Teknik Bisnis Sepeda Motor</option>
            <option value="akl">Akuntansi dan Keuangan Lembaga</option>
          </select>
        </div>
        <div>
          <label
            for="kelas"
            class="block text-sm font-semibold text-gray-700 mb-2"
            >KELAS:</label
          >
          <select
            id="kelas"
            name="kelas"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Pilih Kelas</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
        <button
          type="submit"
          class="w-full bg-gray-800 text-white py-2 rounded-lg font-semibold shadow hover:bg-gray-900 transition"
        >
          kirim ke kabeng/kaprog
        </button>
      </form>
    </div>
  </body>
</html>
