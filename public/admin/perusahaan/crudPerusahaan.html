<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Perusahaan</title>
    <link rel="stylesheet" href="/src/output.css" />
  </head>
  <body class="bg-white">
    <div
      class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg border border-gray-200 mt-8 mb-8 p-8"
    >
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Add New Company</h2>
        <button
          onclick="window.history.back()"
          class="text-gray-400 hover:text-gray-600 text-2xl font-bold"
        >
          &times;
        </button>
      </div>
      <form id="formPerusahaan" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block font-medium mb-1">Company Name *</label>
            <input
              type="text"
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter company name"
              required
            />
          </div>
          <div>
            <label class="block font-medium mb-1">jurusan *</label>
            <select
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
              <option value="">Select a category</option>
              <option value="IT">rpl</option>
              <option value="Finance">tkj</option>
              <option value="Education">bc</option>
              <option value="Other">dkv</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">Description *</label>
          <textarea
            class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="3"
            placeholder="Describe the company..."
            required
          ></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block font-medium mb-1">Address *</label>
            <input
              type="text"
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter address"
              required
            />
          </div>
          <div>
            <label class="block font-medium mb-1">Phone *</label>
            <input
              type="text"
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter phone number"
              required
            />
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">Company Image</label>
          <div class="flex items-center gap-3">
            <button
              type="button"
              class="bg-gray-100 border px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-200 transition"
            >
              Upload Image
            </button>
            <span class="text-gray-400">or paste URL below</span>
          </div>
          <input
            type="url"
            class="w-full border rounded-lg px-4 py-2 mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="https://example.com/image.jpg"
          />
          <p class="text-xs text-gray-500 mt-1">
            Tip: For free image hosting, try
            <a
              href="https://imgbb.com/"
              target="_blank"
              class="text-blue-500 underline"
              >ImgBB</a
            >
          </p>
        </div>
        <div>
          <label class="block font-medium mb-1">Kuota Penerimaan *</label>
          <div class="flex gap-2 mb-2">
            <input
              type="text"
              class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Jumlah Kuota Penerimaan"
            />
            <button
              type="button"
              class="text-blue-600 font-medium hover:underline"
            >
              + Add Kuota
            </button>
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">Benefit *</label>
          <div class="flex gap-2 mb-2">
            <input
              type="text"
              class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Benefit"
            />
            <button
              type="button"
              class="text-blue-600 font-medium hover:underline"
            >
              + Add Benefit
            </button>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-8">
          <button
            type="button"
            onclick="window.history.back()"
            class="px-6 py-2 rounded-lg border border-gray-300 bg-gray-100 text-gray-700 font-medium hover:bg-gray-200 transition"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
          >
            Create Company
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
