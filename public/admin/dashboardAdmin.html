<!DOCTYPE html>

    <title>Admin Panel</title>
    <link rel="stylesheet" href="/src/output.css" />
    <style>
      /* Modal Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      
      @keyframes slideUp {
        from { 
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to { 
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      
      @keyframes slideDown {
        from { 
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to { 
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
      }
    </style>

                </svg>

              <button
                onclick="window.location.href='/logout'"
                class="flex items-center gap-3 px-4 py-2 w-full text-left text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-h-screen md:ml-0">
      <!-- Mobile Header (visible only on mobile) -->
      <div class="md:hidden bg-white border-b border-gray-200 px-4 py-3 pl-16">
        <h1 class="text-lg font-semibold text-gray-800">Dashboard</h1>
      </div>
      
      <!-- Main Content -->
      <main class="flex-1 p-6 overflow-y-auto">
        <div id="mainContentArea"></div>
      </main>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black bg-opacity-40 z-30 md:hidden"></div>

    <script src="/js/navbar.js"></script>
    <script>
    // Fungsi untuk memuat crudAkun.html ke area utama
    async function loadCrudAkun() {
      const mainContentArea = document.getElementById('mainContentArea');
      if (!mainContentArea) return;
      mainContentArea.innerHTML = '<div class="text-center py-8">Loading...</div>';
      try {
        const res = await fetch('/dashboard/admin/akun/crud');
        const html = await res.text();
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        mainContentArea.innerHTML = bodyMatch ? bodyMatch[1] : html;
      } catch (e) {
        mainContentArea.innerHTML = '<div class="text-red-500">Gagal memuat form akun.</div>';
      }
    }
    // Fungsi untuk memuat pantauAkun.html ke area utama
    async function loadPantauAkun() {
      const mainContentArea = document.getElementById('mainContentArea');
      if (!mainContentArea) return;
      mainContentArea.innerHTML = '<div class="text-center py-8">Loading...</div>';
      try {
        const res = await fetch('/dashboard/admin/perusahaan/lists');
        const html = await res.text();
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        mainContentArea.innerHTML = bodyMatch ? bodyMatch[1] : html;
      } catch (e) {
        mainContentArea.innerHTML = '<div class="text-red-500">Gagal memuat data akun.</div>';
      }
    }
    // Fungsi untuk memuat crudPerusahaan.html ke area utama
    async function loadCrudPerusahaan() {
      const mainContentArea = document.getElementById('mainContentArea');
      if (!mainContentArea) return;
      mainContentArea.innerHTML = '<div class="text-center py-8">Loading...</div>';
      try {
        const res = await fetch('/dashboard/admin/perusahaan/crud');
        const html = await res.text();
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        mainContentArea.innerHTML = bodyMatch ? bodyMatch[1] : html;
      } catch (e) {
        mainContentArea.innerHTML = '<div class="text-red-500">Gagal memuat form perusahaan.</div>';
      }
    }
    // Fungsi untuk memuat tabelPerusahaan.html ke area utama
    async function loadTabelPerusahaan() {
      const mainContentArea = document.getElementById('mainContentArea');
      if (!mainContentArea) return;
      mainContentArea.innerHTML = '<div class="text-center py-8">Loading...</div>';
      try {
        const res = await fetch('/dashboard/admin/perusahaan/lists');
        const html = await res.text();
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        mainContentArea.innerHTML = bodyMatch ? bodyMatch[1] : html;
      } catch (e) {
        mainContentArea.innerHTML = '<div class="text-red-500">Gagal memuat data perusahaan.</div>';
      }
    }
    // Event listener tombol 'Lihat Semua Akun', 'Tambah Perusahaan', dan 'Lihat Semua Perusahaan' di navbar
    document.querySelectorAll('button').forEach(btn => {
      const btnText = btn.textContent.trim().toLowerCase();
      if (btnText === 'lihat semua akun') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          loadPantauAkun();
        });
      }
      if (btnText === 'tambah akun') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          loadCrudAkun();
        });
      }
      if (btnText === 'tambah perusahaan') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          loadCrudPerusahaan();
        });
      }
      if (btnText === 'lihat semua perusahaan') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          loadTabelPerusahaan();
        });
      }
    });
    </script>
  </body>
