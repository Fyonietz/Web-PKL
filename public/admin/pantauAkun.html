<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring User</title>
  <link rel="stylesheet" href="../src/output.css" />
</head>
<body class="min-h-screen bg-[#f7f7f8] py-12">
  <div class="w-full min-h-screen px-2 sm:px-6 lg:px-12 py-8 flex flex-col gap-8">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Monitoring User</h1>
      
    </div>
    <p class="text-gray-500 text-base mb-8">view last users</p>
    <!-- Card Statistik -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-10">
      <div class="bg-blue-500 hover:bg-blue-600 transition rounded-2xl p-6 text-white flex flex-col justify-between shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-lg font-semibold">Kabeng</span>
          <span class="text-3xl font-extrabold">2</span>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-sm">TOTAL KABENG/KAPROG</span>
        </div>
      </div>
      <div class="bg-blue-500 hover:bg-blue-600 transition rounded-2xl p-6 text-white flex flex-col justify-between shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-lg font-semibold">Waka Sarana</span>
          <span class="text-3xl font-extrabold">1</span>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-sm">TOTAL WAKA SARANA</span>
        </div>
      </div>
      <div class="bg-blue-500 hover:bg-blue-600 transition rounded-2xl p-6 text-white flex flex-col justify-between shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-lg font-semibold">Guru</span>
          <span class="text-3xl font-extrabold">3</span>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-sm">TOTAL GURU</span>
        </div>
      </div>
      <div class="bg-blue-500 hover:bg-blue-600 transition rounded-2xl p-6 text-white flex flex-col justify-between shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-lg font-semibold">Kepala Sekolah</span>
          <span class="text-3xl font-extrabold">1</span>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-sm">TOTAL KEPALA SEKOLAH</span>
        </div>
      </div>
    </div>
    <!-- Tabel User -->
    <div class="w-full overflow-x-auto rounded-2xl bg-white shadow-lg p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-4">
        <div class="flex items-center gap-2">
          <label for="itemsPerPage" class="text-gray-600 text-sm font-medium">Show</label>
          <select id="itemsPerPage" class="border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-400">
            <option>10</option>
            <option>20</option>
            <option>30</option>
            <option>40</option>
            <option>50</option>
            <option>100</option>
          </select>
          <span class="text-gray-600 text-sm font-medium">entries</span>
        </div>
        <div class="text-gray-500 text-xs md:text-sm">Showing 2 of 2 entries</div>
      </div>
      <table class="w-full rounded-xl overflow-hidden text-sm md:text-base">
        <thead>
          <tr class="bg-gray-50">
            <th class="py-3 px-4 text-left font-semibold text-gray-500">nama</th>
            <th class="py-3 px-4 text-left font-semibold text-gray-500">password</th>
            <th class="py-3 px-4 text-left font-semibold text-gray-500">role</th>
            <th class="py-3 px-4 text-left font-semibold text-gray-500">action</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-blue-50 transition">
            <td class="py-3 px-4 text-black font-medium">user1</td>
            <td class="py-3 px-4 text-blue-700 font-semibold">password1</td>
            <td class="py-3 px-4 text-blue-600 font-bold">Kabeng</td>
            <td class="py-3 px-4">
              <button class="hover:text-red-600" aria-label="Hapus akun user1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </td>
          </tr>
          <tr class="hover:bg-blue-50 transition">
            <td class="py-3 px-4 text-black font-medium">user2</td>
            <td class="py-3 px-4 text-blue-700 font-semibold">password2</td>
            <td class="py-3 px-4 text-blue-600 font-bold">Guru</td>
            <td class="py-3 px-4">
              <button class="hover:text-red-600" aria-label="Hapus akun user2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- Pagination Controls -->
      <div class="flex flex-wrap justify-center items-center gap-2 mt-6">
        <button class="px-3 py-1 bg-white border rounded text-sm text-gray-700 hover:bg-blue-100">&lt;</button>
        <button class="px-3 py-1 border rounded text-sm bg-blue-600 text-white">1</button>
        <button class="px-3 py-1 bg-white border rounded text-sm text-gray-700 hover:bg-blue-100">&gt;</button>
      </div>
    </div>
  </div>
  </div>
</body>
</html>
